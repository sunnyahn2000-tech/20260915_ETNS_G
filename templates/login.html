<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 · ETNS 할일관리</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="wrap auth-wrap">
    <header>
      <h1>✅ ETNS 할일관리</h1>
      <p class="subtitle">로그인하고 할 일을 관리해보세요</p>
    </header>

    {% if error %}
    <div class="auth-error">{{ error }}</div>
    {% endif %}

    <form class="auth-form" action="{{ url_for('login') }}" method="post">
      <label>
        <span>아이디</span>
        <input type="text" name="username" value="{{ username }}" autocomplete="username" required autofocus>
      </label>
      <label>
        <span>비밀번호</span>
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <button type="submit">로그인</button>
    </form>

    <p class="auth-switch">계정이 없으신가요? <a href="{{ url_for('register') }}">회원가입</a></p>
  </div>
</body>
</html>
